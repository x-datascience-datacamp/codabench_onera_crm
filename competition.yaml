version: 2
title: "Datacamp 2026 - ONERA CRM: predict the wall density of an aircraft from flight conditions"
description: >
  Given the flight conditions (Mach number, angle of attack, stagnation
  pressure) of an unseen RANS simulation of the NASA/Boeing Common Research
  Model, predict the air density at each of the 260,774 points of the
  aircraft surface. Data from ONERA. Submissions are code (a benchopt solver)
  that trains on the platform. The public leaderboard scores held-out Mach
  lines, the final ranking uses a hidden set of Mach lines. Powered by
  benchopt.
image: logo.png
registration_auto_approve: False

# The image submissions run in; it carries the requirements.txt stack.
docker_image: ghcr.io/x-datascience-datacamp/onera-crm-compet:v1

# Only the leaderboard metrics are exposed.
enable_detailed_results: False
show_detailed_results_in_submission_panel: False
show_detailed_results_in_leaderboard: False

terms: pages/terms.md
pages:
  - title: Overview
    file: pages/overview.md
  - title: Participation
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Wall density
    description: >
      The ingestion program runs the benchopt benchmark on your submission
      (training on the platform); scoring parses the results.
    input_data: main_phase/input_data/
    reference_data: main_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

# Dates are UTC+0, in the documented YYYY-MM-DD HH:MM:SS format.
# PROVISIONAL dates: set them with the DataCamp calendar.
phases:
  - index: 0
    name: Competition
    description: >
      Build, train and submit your model. The public columns score held-out
      Mach lines; the final ranking uses the hidden private Mach lines.
    start: 2026-10-29 00:00:00
    end: 2027-02-01 00:00:00
    execution_time_limit: 3600
    max_submissions_per_day: 5
    # results.parquet and scores.json carry the hidden private metrics.
    hide_prediction_output: True
    hide_score_output: True
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: Relative MAE (public)
        key: rmae
        index: 0
        sorting: asc
      - title: Worst-run relative MAE (public)
        key: rmae_worst
        index: 1
        sorting: asc
      - title: R2 (public)
        key: r2
        index: 2
        sorting: desc
      - title: Shock-zone relative MAE (public)
        key: shock_rmae
        index: 3
        sorting: asc
      - title: Worst-run shock rel. MAE (public)
        key: shock_rmae_worst
        index: 4
        sorting: asc
      - title: Slice relative MAE (public)
        key: slice_rmae
        index: 5
        sorting: asc
      - title: Relative MAE (private)
        key: rmae_private
        index: 6
        sorting: asc
        hidden: True
      - title: Worst-run relative MAE (private)
        key: rmae_worst_private
        index: 7
        sorting: asc
        hidden: True
      - title: R2 (private)
        key: r2_private
        index: 8
        sorting: desc
        hidden: True
      - title: Shock-zone relative MAE (private)
        key: shock_rmae_private
        index: 9
        sorting: asc
        hidden: True
      - title: Worst-run shock rel. MAE (private)
        key: shock_rmae_worst_private
        index: 10
        sorting: asc
        hidden: True
      - title: Slice relative MAE (private)
        key: slice_rmae_private
        index: 11
        sorting: asc
        hidden: True
      - title: Signed bias (public)
        key: bias
        index: 12
        sorting: asc
        hidden: True
      - title: Signed bias (private)
        key: bias_private
        index: 13
        sorting: asc
        hidden: True
      - title: Signed bias (train)
        key: bias_train
        index: 14
        sorting: asc
        hidden: True
      - title: Duration (s)
        key: duration
        index: 15
        sorting: asc
